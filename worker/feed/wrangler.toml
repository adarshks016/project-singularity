name = "singularity-exam-feed"
main = "src/index.js"
compatibility_date = "2024-11-01"

# Pull the source feed every 3 hours.
[triggers]
crons = ["0 */3 * * *"]

# Cached postings live here. Create the namespace and paste its id below:
#   npx wrangler kv namespace create FEED
[[kv_namespaces]]
binding = "FEED"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
